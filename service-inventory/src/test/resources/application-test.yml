---
server:
  port: 0

spring:
  # Each cached test context keeps a pool on the one test Postgres. At Hikari's
  # ten, eleven contexts pass its limit of 100. A lock test holds two at most.
  datasource:
    hikari:
      maximum-pool-size: 5

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # No broker listens here, so the consumer stays stopped. A test with a
    # RabbitMQ container sets this back to true.
    listener:
      simple:
        auto-startup: false
        # Short waits, so a test reaches the DLQ in well under a second.
        retry:
          initial-interval: 10ms
          max-interval: 40ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://issuer.test.example.com"

logging:
  level:
    com.tombtale: DEBUG

app:
  publish:
    confirm-timeout: PT5S

  # The outbox publisher calls out to RabbitMQ, so it stays off and its tests call it.
  scheduling:
    enabled: false

  # Scheduling is off, so the interval and the cron are not needed.
  outbox:
    batch-size: 100
    confirm-timeout: PT5S
    retention: P30D

inventory:
  # Not .env's 100000, so a test fails if the code ignores the setting.
  starting-coins: 250
  # Not .env's 1000, for the same reason.
  bag-cells: 40
  # Not .env's 60, for the same reason.
  sell-share-percent: 30
