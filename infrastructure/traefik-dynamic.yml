---
# Traefik Dynamic Configuration — File Provider
# Routes locally-running backend microservices through Traefik.
# Used during development when services run outside Docker via ./run-local.sh.
# A new controller prefix needs a router here, or it answers 404. See README.md.

http:
  routers:
    service-player-local:
      rule: "PathPrefix(`/api/v1/players`)"
      entryPoints:
        - web
      service: service-player-local
      priority: 300

    service-commerce-local:
      rule: "PathPrefix(`/api/v1/purchases`)"
      entryPoints:
        - web
      service: service-commerce-local
      priority: 300

    # Keycloak's pages and endpoints for players. /admin is not routed: the
    # admin console has its own localhost port (KEYCLOAK_ADMIN_PORT).
    keycloak:
      rule: "PathPrefix(`/realms`) || PathPrefix(`/resources`)"
      entryPoints:
        - web
      service: keycloak
      priority: 300

  services:
    service-player-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8081"

    service-commerce-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8082"

    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"
