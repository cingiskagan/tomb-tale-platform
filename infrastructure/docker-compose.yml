---
name: tombtale

# Docker's json-file driver keeps a container's log with no size limit, so the
# file grows until the disk complains. Rotation caps it. The log still dies
# with the container: a recreate starts an empty file.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # The single entry point. nginx.conf routes the service prefixes and
  # Keycloak's pages, and answers 404 for anything else (ADR 0025).
  proxy:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - ${PROXY_HTTP_PUBLISHED_PORT}:80
    networks:
      - tombtale
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8099/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      keycloak:
        condition: service_healthy

  # The identity provider. It imports keycloak/import/*.json at start and skips
  # a realm that already exists, so a realm change needs a fresh database
  # (README.md). The proxy routes /realms and /resources only. The admin
  # console answers on a localhost port.
  keycloak:
    build: ./keycloak
    restart: unless-stopped
    logging: *default-logging
    command: start-dev --import-realm
    # The heap is 70% of this. Without a limit the JVM sizes itself from the host.
    mem_limit: 1536m
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      KC_DB_SCHEMA: keycloak
      # The realm file reads these through its ${...} placeholders.
      PORTAL_REDIRECT_URI: ${PORTAL_REDIRECT_URI}
      PORTAL_POST_LOGOUT_URI: ${PORTAL_POST_LOGOUT_URI}
      PORTAL_ORIGIN: ${PORTAL_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT}:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    networks:
      - tombtale
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_KEYCLOAK_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_KEYCLOAK_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      POSTGRES_PLAYER_USER: ${POSTGRES_PLAYER_USER}
      POSTGRES_PLAYER_PASSWORD: ${POSTGRES_PLAYER_PASSWORD}
      POSTGRES_COMMERCE_USER: ${POSTGRES_COMMERCE_USER}
      POSTGRES_COMMERCE_PASSWORD: ${POSTGRES_COMMERCE_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_ADMIN_USER}
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - tombtale

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tombtale

  # Dev-only mail catcher. Keycloak reaches it at mailpit:1025 inside the
  # network; the inbox is at http://localhost:8025 on the host. It accepts
  # every message and delivers none, and keeps no volume, so a restart
  # empties it. Prod points the same SMTP_* values at a real provider.
  mailpit:
    # Defaulted like redis, so a .env written before this service existed
    # still brings the stack up.
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31.2}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Accept any credentials, including none, over an unencrypted
      # connection. Keycloak sends none today. This keeps the handshake working
      # if SMTP_USER is filled in to rehearse a real provider.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"   # SMTP, for Keycloak
      - "8025:8025"   # Web UI, for you
    networks:
      - tombtale

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - observability
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - tombtale

  # --- CUSTOM PLATFORM SERVICES ---
  mongodb:
    image: mongo:6.0
    logging: *default-logging
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - tombtale

  rabbitmq:
    image: rabbitmq:3-management-alpine
    logging: *default-logging
    ports:
      - "5672:5672"   # Internal Message Port
      - "15672:15672" # Management Web UI Port
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # The directory, not the file: an editor that saves by renaming a new
      # file over the old one would hide the change from a file mount.
      - ./rabbitmq:/etc/rabbitmq/platform:ro
    # Loads rabbitmq/definitions.json once the broker runs. As the rabbitmq
    # user, because a root CLI call before startup breaks the Erlang cookie.
    post_start:
      - user: rabbitmq
        command:
          - sh
          - -c
          - >-
            for i in $$(seq 60); do rabbitmq-diagnostics -q check_running >/dev/null 2>&1 && break; sleep 1; done;
            rabbitmqctl -q import_definitions /etc/rabbitmq/platform/definitions.json
    networks:
      - tombtale

networks:
  tombtale:
    name: tombtale

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
