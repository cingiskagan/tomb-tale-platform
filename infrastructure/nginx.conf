# The platform's single entry point, published on PROXY_HTTP_PUBLISHED_PORT.
# /api belongs to the platform services, and every path without a location
# here answers 404 (ADR 0025). A new controller prefix needs its location.

# The services run on the host (run-local.sh). host.docker.internal comes from
# extra_hosts, so these resolve once, at start.
upstream service_player {
    server host.docker.internal:8081;
}

upstream service_commerce {
    server host.docker.internal:8082;
}

# Docker's DNS, so a recreated Keycloak container is found at its new address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Keycloak's login pages set large cookies, and nginx's default buffer
    # cannot hold the response headers that carry them.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    location /api/v1/players {
        proxy_pass http://service_player;
    }

    location /api/v1/purchases {
        proxy_pass http://service_commerce;
    }

    # Keycloak's pages for players. The admin console has its own localhost port.
    location /realms/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
    }

    location /resources/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
    }

    location / {
        return 404;
    }
}

# For the compose healthcheck. It listens inside the container only.
server {
    listen 127.0.0.1:8099;

    location = /healthz {
        access_log off;
        return 204;
    }
}
