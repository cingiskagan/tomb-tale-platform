---
coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 80%

# Mirrors the Jacoco <excludes> in platform-commons/pom.xml,
# service-player/pom.xml and service-commerce/pom.xml. Every list must be
# changed together, or the Codecov percentage stops matching the one the
# build reports.
ignore:
  # Spring wiring: a bean either builds the context or the context fails.
  - "service-player/src/main/java/com/tombtale/serviceplayer/config/**"
  - "service-commerce/src/main/java/com/tombtale/servicecommerce/config/**"
  # Records with validation annotations and no method bodies.
  - "service-player/src/main/java/com/tombtale/serviceplayer/dto/**"
  - "service-commerce/src/main/java/com/tombtale/servicecommerce/dto/**"
  # QueryDSL metamodel, regenerated on every build.
  - "platform-commons/src/main/java/com/tombtale/commons/entity/Q*"
  - "service-player/src/main/java/com/tombtale/serviceplayer/entity/Q*"
  - "service-commerce/src/main/java/com/tombtale/servicecommerce/entity/Q*"
  # MapStruct writes the *MapperImpl; covering it measures MapStruct.
  - "service-player/src/main/java/com/tombtale/serviceplayer/mapper/**"
  - "service-commerce/src/main/java/com/tombtale/servicecommerce/mapper/**"
  # One main() that the smoke tests already run.
  - "service-player/src/main/java/com/tombtale/serviceplayer/ServicePlayerApplication.java"
  - "service-commerce/src/main/java/com/tombtale/servicecommerce/ServiceCommerceApplication.java"
