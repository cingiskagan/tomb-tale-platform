<ng-template [appDialog]="visible" appDialogWidth="30rem" (appDialogDismissed)="close()">
  <h2 mat-dialog-title>{{ isEditMode ? 'Edit Item Set' : 'New Item Set' }}</h2>

  <mat-dialog-content>
    @if (notice) {
      <div
        class="tt-notice"
        role="alert"
        [class.tt-notice-warn]="notice.severity === 'warn'"
        [class.tt-notice-error]="notice.severity === 'error'"
      >
        {{ notice.text }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="save()" class="tt-form">
      <mat-form-field appearance="outline">
        <mat-label>Code</mat-label>
        <input id="setCode" matInput formControlName="code" placeholder="IRON_SET" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input id="setName" matInput formControlName="name" />
      </mat-form-field>

      <app-stats-editor [rows]="form.controls.bonus" label="Bonus for the complete set" />
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()">
      <mat-icon fontIcon="pi-times" />
      Cancel
    </button>
    <button mat-flat-button type="button" [disabled]="form.invalid || !loaded || saving" (click)="save()">
      @if (saving) {
        <mat-progress-spinner class="tt-button-spinner" mode="indeterminate" [diameter]="18" />
      } @else {
        <mat-icon fontIcon="pi-check" />
      }
      Save
    </button>
  </mat-dialog-actions>
</ng-template>
