<p-dialog
  [header]="isEditMode ? 'Edit Template' : 'New Template'"
  [visible]="visible"
  (visibleChange)="$event || close()"
  [modal]="true"
  [style]="{ width: '34rem' }"
  styleClass="item-dialog"
>
  @if (notice) {
    <p-message [severity]="notice.severity" [text]="notice.text" styleClass="mb-3" />
  }

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="field">
      <label for="code">Code</label>
      <input id="code" pInputText formControlName="code" class="w-full" placeholder="SWORD_IRON" />
    </div>

    <div class="field">
      <label for="name">Name</label>
      <input id="name" pInputText formControlName="name" class="w-full" />
    </div>

    <div class="field">
      <label for="itemType">Type</label>
      <p-select
        inputId="itemType"
        formControlName="itemType"
        [options]="typeOptions"
        placeholder="Choose a type"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    <div class="field">
      <label for="price">Price (coins, gray rarity)</label>
      <p-inputNumber inputId="price" formControlName="price" [min]="0" styleClass="w-full" />
    </div>

    <app-stats-editor [rows]="form.controls.baseStats" label="Base stats" />

    <div class="field">
      <label for="itemSetId">Item set</label>
      <p-select
        inputId="itemSetId"
        formControlName="itemSetId"
        [options]="sets"
        optionLabel="name"
        optionValue="publicId"
        placeholder="None"
        [showClear]="true"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    <div class="field">
      <label for="assetKey">Asset key</label>
      <input
        id="assetKey"
        pInputText
        formControlName="assetKey"
        class="w-full"
        placeholder="Items/Weapons/SwordIron"
      />
    </div>

    <div class="field">
      <label for="icon">Icon (PNG or WebP)</label>
      <div class="icon-preview">
        @if (iconUrl && !iconBroken) {
          <img [src]="iconUrl" alt="Icon preview" (error)="iconBroken = true" />
        } @else {
          <i class="pi pi-image generic-icon" aria-hidden="true"></i>
        }
        <input
          id="icon"
          type="file"
          accept="image/png,image/webp"
          [disabled]="uploading"
          (change)="uploadIcon($event)"
        />
        @if (form.controls.iconHash.value) {
          <p-button
            icon="pi pi-times"
            [text]="true"
            severity="danger"
            ariaLabel="Remove icon"
            [disabled]="uploading"
            (onClick)="removeIcon()"
          />
        }
      </div>
    </div>
  </form>

  <ng-template #footer>
    <p-button label="Cancel" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button
      label="Save"
      icon="pi pi-check"
      [disabled]="form.invalid || !loaded || saving || uploading"
      [loading]="saving"
      (onClick)="save()"
    />
  </ng-template>
</p-dialog>
