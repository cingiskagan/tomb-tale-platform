<ng-template [appDialog]="visible" appDialogWidth="400px" (appDialogDismissed)="close()">
  <h2 mat-dialog-title>{{ isEditMode ? 'Edit Purchase' : 'New Purchase' }}</h2>

  <mat-dialog-content>
    <form [formGroup]="form" (ngSubmit)="save()" class="tt-form">
      <mat-form-field appearance="outline">
        <mat-label>Player ID</mat-label>
        <input id="playerId" matInput formControlName="playerId" [readonly]="isEditMode" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Item Code</mat-label>
        <input id="itemCode" matInput formControlName="itemCode" [readonly]="isEditMode" />
      </mat-form-field>

      @if (!isEditMode) {
        <mat-form-field appearance="outline">
          <mat-label>Quantity</mat-label>
          <input id="quantity" matInput type="number" formControlName="quantity" />
        </mat-form-field>
      }

      <mat-form-field appearance="outline">
        <mat-label>Unit Price</mat-label>
        <input id="unitPrice" matInput type="number" step="0.01" formControlName="unitPrice" [readonly]="isEditMode" />
        @if (form.controls['unitPrice'].hasError('centsOnly')) {
          <mat-error>At most two decimals.</mat-error>
        }
      </mat-form-field>

      @if (isEditMode) {
        <mat-form-field appearance="outline">
          <mat-label>Status</mat-label>
          <mat-select id="status" formControlName="status" placeholder="Choose a new status">
            @for (option of statusOptions; track option.value) {
              <mat-option [value]="option.value">{{ option.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      }
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()">
      <mat-icon fontIcon="pi-times" />
      Cancel
    </button>
    <button mat-flat-button type="button" [disabled]="form.invalid || isSaving" (click)="save()">
      @if (isSaving) {
        <mat-progress-spinner class="tt-button-spinner" mode="indeterminate" [diameter]="18" />
      } @else {
        <mat-icon fontIcon="pi-check" />
      }
      Save
    </button>
  </mat-dialog-actions>
</ng-template>
