<ng-template [appDialog]="visible" appDialogWidth="30rem" (appDialogDismissed)="close()">
  <h2 mat-dialog-title>Custom {{ template?.name ?? 'item' }}</h2>

  <mat-dialog-content>
    @if (error) {
      <div class="tt-notice tt-notice-error" role="alert">{{ error }}</div>
    }

    <p class="hint">Every copy a player buys carries exactly this bonus, so testers can try any scenario.</p>

    <form [formGroup]="form" (ngSubmit)="save()" class="tt-form">
      <mat-form-field appearance="outline">
        <mat-label>Rarity</mat-label>
        <mat-select id="customRarity" formControlName="rarity">
          @for (option of rarities; track option.value) {
            <mat-option [value]="option.value">{{ option.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <app-stats-editor [rows]="form.controls.bonus" label="Bonus" />
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()">
      <mat-icon fontIcon="pi-times" />
      Cancel
    </button>
    <button mat-flat-button type="button" [disabled]="form.invalid || saving" (click)="save()">
      @if (saving) {
        <mat-progress-spinner class="tt-button-spinner" mode="indeterminate" [diameter]="18" />
      } @else {
        <mat-icon fontIcon="pi-check" />
      }
      Add to stand
    </button>
  </mat-dialog-actions>
</ng-template>
