<div class="dealers-container">
  <h2 class="page-title">Dealers</h2>

  <div class="header-actions">
    <span>Every dealer, retired ones grayed out. The town finds a dealer's stand by its code.</span>
    <button mat-flat-button type="button" (click)="openForm(null)">
      <mat-icon fontIcon="pi-plus" />
      New Dealer
    </button>
  </div>

  <div class="tt-table">
    @if (loading) {
      <mat-progress-bar mode="indeterminate" />
    }
    <table
      mat-table
      [dataSource]="dealers"
      matSort
      matSortDisableClear
      [matSortActive]="query.sort.active"
      [matSortDirection]="query.sort.direction"
      (matSortChange)="sortDealers($event)"
    >
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef mat-sort-header scope="col">Code</th>
        <td mat-cell *matCellDef="let dealer">{{ dealer.code }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header scope="col">Name</th>
        <td mat-cell *matCellDef="let dealer">{{ dealer.name }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef scope="col">Status</th>
        <td mat-cell *matCellDef="let dealer">
          @if (dealer.retired) {
            <span class="tt-tag">RETIRED</span>
          } @else {
            <span class="tt-tag tt-tag-success">ACTIVE</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef scope="col">Actions</th>
        <td mat-cell *matCellDef="let dealer">
          <button mat-button type="button" [disabled]="dealer.retired" (click)="openStand(dealer)">
            <mat-icon fontIcon="pi-shop" />
            Store
          </button>
          <button
            mat-icon-button
            type="button"
            class="tt-action-success"
            aria-label="Edit"
            (click)="openForm(dealer.publicId)"
          >
            <mat-icon fontIcon="pi-pencil" />
          </button>
          <button
            mat-icon-button
            type="button"
            class="tt-action-danger"
            aria-label="Retire"
            [disabled]="dealer.retired"
            (click)="confirmRetire(dealer)"
          >
            <mat-icon fontIcon="pi-ban" />
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let dealer; columns: columns" [class.retired]="dealer.retired"></tr>
      <tr class="mat-mdc-row" *matNoDataRow>
        <td class="mat-mdc-cell" [attr.colspan]="columns.length">No dealers yet.</td>
      </tr>
    </table>
  </div>
  <mat-paginator
    [length]="total"
    [pageIndex]="query.page"
    [pageSize]="query.size"
    showFirstLastButtons
    (page)="pageDealers($event)"
  />
</div>

<app-dealer-form [dealerPublicId]="selectedDealerId" [(visible)]="isFormVisible" (saved)="onSaved()" />

<app-stand-editor
  [dealer]="standDealer"
  [customEnabled]="customStandItemsEnabled"
  [(visible)]="isStandVisible"
/>
