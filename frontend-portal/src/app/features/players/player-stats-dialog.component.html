<p-dialog header="Edit Player Stats" [(visible)]="visible" (visibleChange)="visibleChange.emit($event)" [modal]="true"
  [style]="{ width: '420px' }" (onHide)="close()">
  <form [formGroup]="form" (ngSubmit)="save()" id="stats-form" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <span class="font-semibold text-color-secondary">Player & Character</span>
      <div class="p-inputtext p-component p-disabled" style="cursor: default;">
        {{ player?.displayName || 'Loading...' }}
        @if (player?.characters?.length) {
          <span class="ml-1 text-color-secondary font-italic">
            ({{ player!.characters[0].name }})
          </span>
        }
      </div>
    </div>
    <div class="flex flex-col gap-1">
      <label for="level" class="font-semibold">Level</label>
      <p-inputNumber inputId="level" formControlName="level" [min]="1" [showButtons]="true" [fluid]="true" />
    </div>
    <div class="flex flex-col gap-1">
      <label for="experiencePoints" class="font-semibold">Experience Points</label>
      <p-inputNumber inputId="experiencePoints" formControlName="experiencePoints" [min]="0"
        [showButtons]="true" [step]="100" [fluid]="true" />
    </div>
  </form>
  <ng-template pTemplate="footer">
    <p-button label="Cancel" [text]="true" severity="secondary" (onClick)="close()" />
    <p-button label="Save Stats" (onClick)="save()" [loading]="saving"
      [disabled]="form.invalid || saving" />
  </ng-template>
</p-dialog>
