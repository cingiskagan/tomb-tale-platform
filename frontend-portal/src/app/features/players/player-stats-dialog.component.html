<ng-template [appDialog]="visible" appDialogWidth="420px" (appDialogDismissed)="close()">
  <h2 mat-dialog-title>Edit Player Stats</h2>

  <mat-dialog-content>
    <form [formGroup]="form" (ngSubmit)="save()" id="stats-form" class="tt-form">
      <mat-form-field appearance="outline">
        <mat-label>Player &amp; Character</mat-label>
        <input matInput readonly [value]="playerLabel" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Level</mat-label>
        <input id="level" matInput type="number" formControlName="level" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Experience Points</mat-label>
        <input id="experiencePoints" matInput type="number" step="100" formControlName="experiencePoints" />
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button mat-flat-button type="button" [disabled]="form.invalid || saving" (click)="save()">
      @if (saving) {
        <mat-progress-spinner class="tt-button-spinner" mode="indeterminate" [diameter]="18" />
      }
      Save Stats
    </button>
  </mat-dialog-actions>
</ng-template>
