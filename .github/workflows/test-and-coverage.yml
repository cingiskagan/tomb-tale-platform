---
name: "Test and Coverage"

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: read-all

jobs:
  # One job fills the Maven cache and the test jobs only read it, so Maven
  # Central sees one download per pom change instead of one per module.
  maven-cache:
    name: Fill the Maven cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore the Maven cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          # A pom change starts from the last cache and downloads the difference.
          restore-keys: maven-

      - name: Download what the build needs
        if: steps.cache.outputs.cache-hit != 'true'
        # Tests run too: surefire loads its JUnit provider only when they do.
        # Their results are the test jobs' to report.
        run: ./mvnw clean verify -Dmaven.test.failure.ignore=true

  test:
    name: Run Tests & Upload Coverage
    needs: maven-cache
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # platform-commons is built and measured like the services. It is a
        # reactor module, so each job builds its target with `-am` and gets the
        # dependency from the same build rather than from a previous one.
        service: [platform-commons, service-player, service-commerce, service-inventory, service-audit, infrastructure/keycloak/public-id-mapper]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore the Maven cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          fail-on-cache-miss: true

      - name: Run Maven Tests and Generate Jacoco Report
        # Offline, so anything missing from the cache fails here instead of
        # reaching Maven Central.
        run: ./mvnw -o -pl ${{ matrix.service }} -am clean verify

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./${{ matrix.service }}/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: true

  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # `npm ci` runs lifecycle scripts from the whole dependency tree.
          # Without this, checkout leaves the job token in .git/config where
          # any of those scripts could read it. Nothing here touches git after
          # the checkout, so there is no reason to keep the credentials.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth, so CI and a local `nvm use`
          # can never drift apart.
          node-version-file: frontend-portal/.nvmrc
          cache: npm
          cache-dependency-path: frontend-portal/package-lock.json

      - name: Install dependencies
        working-directory: frontend-portal
        run: npm ci

      - name: Lint
        working-directory: frontend-portal
        run: npm run lint

      - name: Production build
        working-directory: frontend-portal
        run: npm run build

      - name: Resolve Chrome for Karma
        # Karma launches the browser itself and needs a real executable. The
        # runner image ships Google Chrome; fail loudly if that ever changes,
        # rather than letting the tests silently not run.
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome or Chromium on the runner." >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: frontend-portal
        run: npx ng test --watch=false --browsers=ChromeHeadless
