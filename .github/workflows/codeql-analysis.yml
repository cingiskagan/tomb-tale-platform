---
name: "CodeQL Analysis"

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '30 11 * * 1'

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # Every module must be compiled here. With build-mode: manual,
      # CodeQL only analyses classes compiled while its tracer is
      # attached. Anything left unbuilt is skipped in silence, and the
      # scan still reports success.
      #
      # One build from the reactor root, not one per service. Building a
      # service from its own directory cannot resolve platform-commons,
      # which is a sibling module rather than a published artifact, and a
      # root build also cannot leave a module out by omission.
      - name: Build every module
        if: matrix.build-mode == 'manual'
        run: ./mvnw clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
