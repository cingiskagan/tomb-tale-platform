---
# MegaLinter GitHub Actions Workflow
# https://megalinter.io
name: MegaLinter

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-megalinter
  cancel-in-progress: true

permissions: read-all

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      # For PR comments and status checks
      issues: write
      pull-requests: write
      # For pushing auto-fixes (elevate to 'write' if APPLY_FIXES is enabled)
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0 # Full history for better linting context

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@15e5b45552097e318c93de385779ce3b1084052c  # v9
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload reports as artifacts for review
      - name: Archive MegaLinter reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MegaLinter-reports
          path: |
            megalinter-reports
          retention-days: 7
