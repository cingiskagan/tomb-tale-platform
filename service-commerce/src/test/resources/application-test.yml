---
spring:
  application:
    name: service-commerce

  # --- In-memory H2 for tests (no PostgreSQL dependency in CI) ---
  datasource:
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  # --- RabbitMQ (test-safe defaults) ---
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # --- Disable OAuth2 auto-discovery in tests ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://localhost:8080"

server:
  port: 0

logging:
  level:
    com.tombtale: DEBUG
