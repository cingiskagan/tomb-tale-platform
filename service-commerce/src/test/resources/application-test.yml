---
spring:
  application:
    name: service-commerce

  # --- In-memory H2 for tests (no PostgreSQL dependency in CI) ---
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true

  # H2 + create-drop until B3 brings in Testcontainers; the baseline is
  # Postgres SQL and does not belong on H2.
  flyway:
    enabled: false

  # --- Seed Data ---
  sql:
    init:
      mode: always

  # --- RabbitMQ (test-safe defaults) ---
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # --- OAuth2 Configuration ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://localhost:8080"

server:
  port: 0

logging:
  level:
    com.tombtale: DEBUG
