---
server:
  port: 0

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # No broker listens here, so the consumer stays stopped. A test with a
    # RabbitMQ container sets this back to true.
    listener:
      simple:
        auto-startup: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://issuer.test.example.com"

logging:
  level:
    com.tombtale: DEBUG
