---
spring:
  application:
    name: service-commerce

  # --- PostgreSQL ---
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tombtale}
    username: ${POSTGRES_COMMERCE_USER}
    password: ${POSTGRES_COMMERCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    # NOTE: no defer-datasource-initialization here. It exists to let data.sql
    # run after Hibernate has built the schema, and it works by removing the
    # EntityManagerFactory's dependency on the database initializers — Flyway
    # included. With it set, Hibernate validates before Flyway migrates and
    # fails on an empty schema. The test profile keeps its own copy for the
    # H2 + data.sql path; on Postgres, Flyway owns the schema.
    properties:
      hibernate:
        default_schema: commerce
        format_sql: true
        jdbc:
          time_zone: UTC

  # --- Flyway (owns the schema; Hibernate only validates it) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: commerce

  # --- Seed Data ---
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      continue-on-error: false

  # --- RabbitMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true

  # --- OAuth2 Resource Server (Zitadel JWT) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ZITADEL_ISSUER_URI}

server:
  port: ${SERVER_PORT}

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.tombtale: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
