---
# The outbox tests. Each service's own migration creates its outbox table, and
# this module has none, so Hibernate creates the table from the entity here.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # Rabbit auto-configuration runs only in the tests that start a broker.
  rabbitmq:
    # The publisher marks a row sent only after the broker confirms the message.
    publisher-confirm-type: simple
    # A message carries the sender's trace.
    template:
      observation-enabled: true

# Traces stay in the test, as they stay in each service (ADR 0028).
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false

# Nothing schedules the publisher here, so the interval and the cron are not needed.
app:
  outbox:
    batch-size: 100
    confirm-timeout: PT5S
    retention: P30D
