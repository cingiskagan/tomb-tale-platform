---
# Test profile: the database is a real Postgres in Docker, started by
# Testcontainers (see PostgresTestBase). @ServiceConnection supplies the url,
# username, and password, so there is no datasource block here at all.
#
# Flyway and ddl-auto: validate are inherited from application.yml on purpose:
# the tests now build the schema from V1__baseline.sql and Hibernate validates
# the entities against it.
server:
  port: 0
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.test.example.com

  # Disable auto-connect to external services during tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# A fixed key so a test can sign a body the way Zitadel would.
app:
  # ProvisioningReconciler is the only scheduled job, and it calls Zitadel. A
  # @SpringBootTest would start it against nothing, so it stays off here and is
  # driven directly by its own unit tests.
  scheduling:
    enabled: false

  zitadel:
    webhook:
      signing-key: test-signing-key
    # The BODY the controller tests post carries userID = this, so the payload
    # reads as a self-registration. One test overrides it to prove the opposite.
    registration:
      login-client-id: "336392597046755331"
