---
spring:
  application:
    name: service-player

  # --- PostgreSQL ---
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tombtale}
    username: ${POSTGRES_PLAYER_USER}
    password: ${POSTGRES_PLAYER_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: player
        format_sql: true
        jdbc:
          time_zone: UTC

  # --- Flyway (owns the schema; Hibernate only validates it) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: player

  # --- RabbitMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  # --- OAuth2 Resource Server (Zitadel JWT) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ZITADEL_ISSUER_URI}

server:
  port: ${SERVER_PORT}

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# --- Zitadel API client (grants the player role on self-registration) ---
# The token belongs to a machine user zitadel-setup.sh creates; it may grant
# roles on this project and nothing else. Blank means a self-registered user is
# provisioned a row and then cannot log in, so provisionPlayer fails loudly
# rather than leaving that state behind.
app:
  zitadel:
    api:
      base-url: ${ZITADEL_ISSUER_URI:}
      token: ${ZITADEL_PROVISIONER_TOKEN:}
      project-id: ${ZITADEL_PROJECT_ID:}

    # The signing key Zitadel shows when the target is created (ADR 0018).
    # Blank refuses every call to /internal/zitadel/**, which is the safe
    # default for an unconfigured environment.
    webhook:
      signing-key: ${ZITADEL_WEBHOOK_SIGNING_KEY:}
      tolerance: 5m

logging:
  level:
    com.tombtale: INFO
