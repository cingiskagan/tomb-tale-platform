---
spring:
  application:
    name: service-player

  # --- PostgreSQL ---
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tombtale}
    username: ${POSTGRES_PLAYER_USER}
    password: ${POSTGRES_PLAYER_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: player
        format_sql: true
        jdbc:
          time_zone: UTC

  # --- Flyway (owns the schema; Hibernate only validates it) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: player

  # --- RabbitMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # The outbox marks a row sent only after the broker confirms the message.
    publisher-confirm-type: simple

  # --- OAuth2 Resource Server (Keycloak JWT) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}

server:
  port: ${SERVER_PORT}

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# --- Platform settings ---
app:
  # The outbox publisher. On unless this says otherwise; the test profile turns
  # it off so no test calls out to anything.
  scheduling:
    enabled: true

  # From infrastructure/.env. .env.example says what each value does.
  outbox:
    publish-interval: ${OUTBOX_PUBLISH_INTERVAL}
    batch-size: ${OUTBOX_BATCH_SIZE}
    confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT}
    retention: ${OUTBOX_RETENTION}
    purge-cron: ${OUTBOX_PURGE_CRON}

logging:
  level:
    com.tombtale: INFO
