# =============================================
# Development Profile — Local Docker Compose
# =============================================
# Activate with: --spring.profiles.active=dev
# or set SPRING_PROFILES_ACTIVE=dev

---
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tombtale
    username: ${POSTGRES_PLAYER_USER:svc_player}
    password: ${POSTGRES_PLAYER_PASSWORD:player_secret}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:adminpassword}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080

server:
  port: 8081

logging:
  level:
    com.tombtale: DEBUG
    org.springframework.security: DEBUG
